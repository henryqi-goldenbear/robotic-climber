<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Knot Verification{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold text-success" href="/">
      <i class="bi bi-shield-check me-2"></i>Knot Verification
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">
            <i class="bi bi-house me-1"></i>Overview
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'gallery' %}active{% endif %}" href="{{ url_for('gallery') }}">
            <i class="bi bi-images me-1"></i>Gallery
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'predict' %}active{% endif %}" href="{{ url_for('predict') }}">
            <i class="bi bi-cpu me-1"></i>Run Inference
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'stats' %}active{% endif %}" href="{{ url_for('stats') }}">
            <i class="bi bi-bar-chart me-1"></i>Stats
          </a>
        </li>
      </ul>
      <span class="navbar-text text-secondary small">
        <i class="bi bi-robot me-1"></i>Robotic Climber · Local Demo
      </span>
    </div>
  </div>
</nav>

<main class="container-fluid py-4 px-4">
  {% block content %}{% endblock %}
</main>

<footer class="text-center text-secondary small py-3 border-top border-secondary mt-4">
  YOLOv10-N + DINOv2-Small + Linear SVM &nbsp;·&nbsp;
  {{ stats.total if stats is defined else '' }} annotated images
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
