<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Summit Guardian{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="text-light">

<nav class="navbar navbar-expand-lg navbar-dark summit-nav sticky-top">
  <div class="container-fluid px-lg-5">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
      <span class="brand-mark"><i class="bi bi-triangle-fill"></i></span>
      <span>SUMMIT <span class="text-gradient">GUARDIAN</span></span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">
            <i class="bi bi-grid-1x2 me-1"></i>Mission Control
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'gallery' %}active{% endif %}" href="{{ url_for('gallery') }}">
            <i class="bi bi-images me-1"></i>Training Data
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'predict' %}active{% endif %}" href="{{ url_for('predict') }}">
            <i class="bi bi-eye me-1"></i>Vision Demo
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'avalanche' %}active{% endif %}" href="{{ url_for('avalanche') }}">
            <i class="bi bi-snow2 me-1"></i>Avalanche
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'stats' %}active{% endif %}" href="{{ url_for('stats') }}">
            <i class="bi bi-graph-up-arrow me-1"></i>Evidence
          </a>
        </li>
      </ul>
      <span class="navbar-text system-pill">
        <span class="status-dot"></span>
        EDGE SAFETY SYSTEM
      </span>
    </div>
  </div>
</nav>

<main class="{% block main_class %}container-fluid py-4 px-4{% endblock %}">
  {% block content %}{% endblock %}
</main>

<footer class="summit-footer">
  <div class="container-fluid px-lg-5 d-flex flex-wrap justify-content-between gap-3">
    <span><strong>Summit Guardian</strong> · Robotic intelligence for the vertical frontier</span>
    <span>YOLOv10-N · DINOv2-Small · LiveKit · Edge-first</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
